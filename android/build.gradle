buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension != null && ["app", "react-native-reanimated"].contains(subproject.name)) {
            def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
            def shortCxxDir = isWindows
                ? new File("C:/tmp/mediasfu-rn-cxx/${subproject.name}")
                : new File(rootProject.buildDir, "cxx/${subproject.name}")
            androidExtension.externalNativeBuild.cmake {
                buildStagingDirectory shortCxxDir
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
